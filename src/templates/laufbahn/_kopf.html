{% load i18n %}
<p class="brotkrumen"><a href="{% url 'start' %}">{% translate "Start" %}</a> › {% if bereich == "verwaltung" %}{% translate "Verwaltung" %}{% else %}{% translate "Schulleitung" %}{% endif %} › {{ titel }}</p>
<h1>{{ titel }}</h1>
{% if reiter|length > 1 %}
<nav class="an-tabs sy-reiter" aria-label="{% translate 'Schuljahr und Archiv' %}">
  {% for r in reiter %}<a href="{% url r.url %}"{% if r.aktiv %} aria-current="page" class="aktiv"{% endif %}>{{ r.name }}</a>{% endfor %}
</nav>
{% endif %}
