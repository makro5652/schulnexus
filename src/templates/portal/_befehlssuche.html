{% load i18n %}{# Befehlssuche Strg+K (befehle.js), gemeinsam für Menüband und Skizzenbuch; nur für Konten mit MENUEBAND #}
<dialog class="bs" id="bs" aria-label="{% translate 'Befehl suchen' %}"
        data-t-person="{% translate 'Person suchen: „{q}“' %}" data-t-zuletzt="{% translate 'Zuletzt verwendet' %}" data-t-favoriten="{% translate 'Favoriten' %}"
        data-t-alle="{% translate 'Alle Befehle' %}" data-t-merken="{% translate 'Als Favorit merken' %}" data-t-entfernen="{% translate 'Favorit entfernen' %}"
        data-t-keine="{% translate 'Kein Befehl gefunden.' %}" data-suche="{% url 'suche' %}">
  <div class="bs-kopf">
    <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#s-lupe"/></svg>
    <input type="search" id="bs-eingabe" placeholder="{% translate 'Was möchten Sie tun? z. B. Fehlzeit, Zeugnis, 9a …' %}" aria-label="{% translate 'Befehl suchen' %}" autocomplete="off" spellcheck="false">
  </div>
  <div class="bs-liste" id="bs-liste" role="listbox" aria-label="{% translate 'Befehle' %}"></div>
  <p class="bs-fuss"><kbd>↑</kbd> <kbd>↓</kbd> {% translate "wählen" %} · <kbd>Enter</kbd> {% translate "öffnen" %} · <kbd>★</kbd> {% translate "merkt einen Befehl als Favorit" %} · <kbd>Esc</kbd> {% translate "schließen" %}</p>
</dialog>
