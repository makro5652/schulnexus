{% extends "portal/base.html" %}
{% block title %}Anmelden{% endblock %}
{% block inhalt %}
<section class="karte anmeldung">
  <h1>Anmelden</h1>
  {% if form.errors %}<p class="fehler">Benutzername oder Passwort sind falsch.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>Benutzername <input name="username" autocomplete="username" required autofocus></label>
    <label>Passwort <input type="password" name="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="knopf">Anmelden</button>
  </form>
</section>
{% endblock %}
