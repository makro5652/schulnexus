{% extends "portal/base.html" %}
{% load i18n %}
{% block title %}{% translate "Anmelden" %}{% endblock %}
{% block inhalt %}
<section class="karte anmeldung">
  <h1>{% translate "Anmelden" %}</h1>
  {% if form.errors %}<p class="fehler">{% translate "Benutzername oder Passwort sind falsch." %}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label>{% translate "Benutzername" %} <input name="username" autocomplete="username" required autofocus></label>
    <label>{% translate "Passwort" %} <input type="password" name="password" autocomplete="current-password" required></label>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="knopf">{% translate "Anmelden" %}</button>
  </form>
</section>
{% endblock %}
