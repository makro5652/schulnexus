{% load i18n %}{% get_current_language as SPRACHE %}
<details class="sprachmenue">
  <summary aria-label="{% translate 'Sprache wählen' %}">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.9 5.8 3.9 9s-1.3 6.2-3.9 9c-2.6-2.8-3.9-5.8-3.9-9s1.3-6.2 3.9-9z"/></svg>
    <span>{{ SPRACHE|upper }}</span>
  </summary>
  <form method="post" action="{% url 'sprache_wechseln' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% for code, name in SPRACHEN %}
      <button type="submit" name="sprache" value="{{ code }}" lang="{{ code }}"{% if code == SPRACHE %} aria-current="true"{% endif %}>{{ name }}</button>
    {% endfor %}
  </form>
</details>
